<style>
progress.loading-spinner:indeterminate::-webkit-progress-bar { display: none; background: none; }
progress.loading-spinner:indeterminate::-webkit-progress-value { display: none; background: none; }
progress.loading-spinner:indeterminate::-moz-progress-bar { display: none; background: none; }
progress.loading-spinner {
  appearance: none; border: 0; background: none;
  inline-size: 36px; block-size: 36px; border-radius: 50%;
  border: 4px solid var(--surface); border-top-color: var(--accent);
}
progress.loading-spinner.small { inline-size: 18px; block-size: 18px; border-width: 3px; border-top-color: currentColor; border-right-color: transparent; border-bottom-color: transparent; border-left-color: transparent; }
@media (prefers-reduced-motion: no-preference) { progress.loading-spinner { animation: spin .8s linear infinite; } }
@media (prefers-reduced-motion: reduce) { progress.loading-spinner { animation: pulse 1.6s ease-in-out infinite; } }
@keyframes spin { to { rotate: 1turn; } }
@keyframes pulse { 50% { opacity: .4; } }
.panel { display: grid; place-items: center; gap: 10px; min-height: 120px; border: 1px dashed var(--line); border-radius: var(--radius); max-width: 420px; padding: 16px; }
.save { display: inline-flex; align-items: center; gap: 8px; }
</style>

<div class="stack">
  <div class="panel" id="panel" aria-busy="true">
    <progress aria-label="Loading messages" class="loading-spinner"></progress>
    <p class="muted">Loading messages…</p>
  </div>
  <div class="row">
    <button type="button" class="primary save" id="save"><span>Save draft</span></button>
    <button type="button" id="reload">Reload messages</button>
  </div>
</div>
<p class="note" style="margin-top:12px">The spinner is an indeterminate <code>&lt;progress&gt;</code>, so assistive tech knows something is loading. It spins with <code>rotate</code> (cheap to animate) and only pulses for people who prefer reduced motion.</p>

<script>
const panel = document.getElementById("panel");
function load() {
  panel.setAttribute("aria-busy", "true");
  panel.innerHTML = '<progress aria-label="Loading messages" class="loading-spinner"></progress><p class="muted">Loading messages…</p>';
  setTimeout(() => { panel.setAttribute("aria-busy", "false"); panel.innerHTML = '<p><strong>3 new messages</strong></p><p class="muted">Latest: “Lunch at 1?” from Priya</p>'; }, 1800);
}
document.getElementById("reload").addEventListener("click", load);
document.getElementById("save").addEventListener("click", (e) => {
  const b = e.currentTarget; if (b.disabled) return;
  b.disabled = true;
  b.innerHTML = '<progress aria-label="Saving" class="loading-spinner small"></progress><span>Saving…</span>';
  setTimeout(() => { b.disabled = false; b.innerHTML = "<span>Saved ✓</span>"; setTimeout(() => (b.innerHTML = "<span>Save draft</span>"), 1500); }, 1200);
});
load();
</script>

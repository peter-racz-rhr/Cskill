<style>
#toast {
  inset: auto 16px 16px auto; margin: 0; max-width: min(340px, calc(100vw - 32px));
  display: none; gap: 10px; align-items: start; padding: 12px 14px;
}
#toast:popover-open { display: flex; }
#toast .msg { flex: 1; }
#toast .close { border: 0; background: none; padding: 2px 6px; font-size: 18px; line-height: 1; }
@media (prefers-reduced-motion: no-preference) {
  #toast { transition: opacity .2s, translate .2s, overlay .2s allow-discrete, display .2s allow-discrete; }
  #toast:not(:popover-open) { opacity: 0; translate: 0 10px; }
  @starting-style { #toast:popover-open { opacity: 0; translate: 0 10px; } }
}
.log { border: 1px solid var(--line); border-radius: var(--radius); padding: 10px 14px; max-width: 420px; }
.log li { color: var(--muted); }
</style>

<div class="stack">
  <div class="row">
    <button type="button" class="primary" data-msg="Message sent to Priya.">Send message</button>
    <button type="button" data-msg="Settings saved.">Save settings</button>
  </div>
  <div class="log"><strong>Activity</strong><ul id="log" style="margin:6px 0 0;padding-left:18px"><li>Nothing yet.</li></ul></div>
</div>

<div id="notification" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></div>
<div id="toast" popover="manual">
  <span class="msg"></span>
  <button type="button" class="close" aria-label="Dismiss notification">×</button>
</div>
<p class="note" style="margin-top:12px">A <code>popover="manual"</code> toast stays until you dismiss it or it times out, and pauses while you hover or focus it. Its message is also written to a live region and to the Activity list, so it isn't lost when it disappears.</p>

<script>
const toast = document.getElementById("toast");
const live = document.getElementById("notification");
let timer;
function notify(text) {
  toast.querySelector(".msg").textContent = text;
  live.textContent = text;
  const log = document.getElementById("log");
  if (log.firstElementChild?.textContent === "Nothing yet.") log.replaceChildren();
  const li = document.createElement("li"); li.textContent = new Date().toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" }) + " · " + text; log.prepend(li);
  if (!toast.matches(":popover-open")) toast.showPopover();
  arm();
}
function arm() { clearTimeout(timer); timer = setTimeout(() => toast.hidePopover(), 5000); }
toast.addEventListener("pointerenter", () => clearTimeout(timer));
toast.addEventListener("focusin", () => clearTimeout(timer));
toast.addEventListener("pointerleave", arm);
toast.addEventListener("focusout", arm);
toast.querySelector(".close").addEventListener("click", () => toast.hidePopover());
document.addEventListener("click", (e) => { const b = e.target.closest("[data-msg]"); if (b) notify(b.dataset.msg); });
</script>

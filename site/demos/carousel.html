<style>
.carousel { max-width: 560px; display: grid; gap: 10px; }
.carousel-controls { display: flex; justify-content: space-between; align-items: center; }
.carousel-track { display: flex; gap: 1rem; overflow-x: auto; scroll-snap-type: x mandatory; overscroll-behavior-x: contain; scrollbar-width: none; border-radius: var(--radius); }
@media (prefers-reduced-motion: no-preference) { .carousel-track { scroll-behavior: smooth; } }
.carousel-track > * { flex: 0 0 100%; scroll-snap-align: center; height: 170px; border-radius: var(--radius); display: grid; align-content: end; padding: 16px; color: #fff; }
.carousel-track h3 { font-size: 22px; text-shadow: 0 1px 8px rgb(0 0 0 / .35); }
.carousel-track p { opacity: .9; }
.markers { display: flex; justify-content: center; gap: 8px; }
.markers button { width: 12px; height: 12px; padding: 0; border-radius: 50%; background: var(--line); border: 0; }
.markers button[aria-current="true"] { background: var(--accent); }
</style>

<section class="carousel" aria-roledescription="carousel" aria-label="Featured trails">
  <div class="carousel-controls">
    <button type="button" data-direction="previous" aria-label="Previous slide">←</button>
    <p class="note" id="status" aria-live="polite">Slide 1 of 3</p>
    <button type="button" data-direction="next" aria-label="Next slide">→</button>
  </div>
  <div class="carousel-track" tabindex="0" role="group" aria-label="Slides">
    <div role="group" aria-roledescription="slide" aria-label="1 of 3" style="background:linear-gradient(160deg,#4a7c59,#1f3d2b)"><h3>Ridge loop</h3><p>11 km · 640 m climb</p></div>
    <div role="group" aria-roledescription="slide" aria-label="2 of 3" style="background:linear-gradient(160deg,#3b6ea5,#1b2f52)"><h3>Lakeshore path</h3><p>6 km · flat</p></div>
    <div role="group" aria-roledescription="slide" aria-label="3 of 3" style="background:linear-gradient(160deg,#a5603b,#4d2512)"><h3>Canyon descent</h3><p>14 km · 900 m drop</p></div>
  </div>
  <div class="markers" role="group" aria-label="Choose a slide"></div>
</section>
<p class="note" style="margin-top:8px">Scroll snapping does the sliding; the buttons and dots scroll the track. The status line updates once scrolling settles (<code>scrollend</code>).</p>

<script>
const track = document.querySelector(".carousel-track");
const slides = [...track.children];
const markers = document.querySelector(".markers");
const status = document.getElementById("status");
slides.forEach((s, i) => {
  const b = document.createElement("button");
  b.type = "button"; b.setAttribute("aria-label", `Go to slide ${i + 1}`);
  b.addEventListener("click", () => go(i));
  markers.append(b);
});
const current = () => Math.round(track.scrollLeft / track.clientWidth);
const go = (i) => track.scrollTo({ left: Math.max(0, Math.min(slides.length - 1, i)) * track.clientWidth });
document.querySelector(".carousel-controls").addEventListener("click", (e) => {
  const d = e.target.closest("[data-direction]")?.dataset.direction;
  if (d) go(current() + (d === "next" ? 1 : -1));
});
function settle() {
  const i = current();
  status.textContent = `Slide ${i + 1} of ${slides.length}`;
  [...markers.children].forEach((m, j) => m.setAttribute("aria-current", i === j));
  slides.forEach((s, j) => (s.inert = i !== j));
}
if ("onscrollend" in window) track.addEventListener("scrollend", settle);
else { let t; track.addEventListener("scroll", () => { clearTimeout(t); t = setTimeout(settle, 120); }); }
settle();
</script>

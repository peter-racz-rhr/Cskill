name: Globe Tunes — refresh charts & publish

# Publishes globe-tunes/ to the gh-pages branch, which GitHub Pages serves at
# https://peter-racz-rhr.github.io/Cskill/
# Pushes to main publish the committed chart snapshot right away;
# the daily scheduled run downloads fresh charts first.

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["globe-tunes/**", ".github/workflows/globe-tunes.yml"]

permissions:
  contents: write

concurrency:
  group: globe-tunes-publish
  cancel-in-progress: true

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download today's charts
        if: github.event_name != 'push'
        working-directory: globe-tunes
        run: node scripts/fetch-charts.mjs
      - name: Publish to gh-pages
        run: |
          out=$(mktemp -d)
          cp -r globe-tunes/index.html globe-tunes/app.css globe-tunes/app.js globe-tunes/glass.js globe-tunes/vendor globe-tunes/data "$out"/
          touch "$out/.nojekyll"
          cd "$out"
          git init -q -b gh-pages
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -qm "Publish Globe Tunes ($(date -u +%F))"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" gh-pages

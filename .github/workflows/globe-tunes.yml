name: Globe Tunes — refresh charts & deploy

on:
  schedule:
    - cron: "17 6 * * *"   # daily, 06:17 UTC
  workflow_dispatch:
  push:
    branches: [main]
    paths: ["globe-tunes/**", ".github/workflows/globe-tunes.yml"]

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: globe-tunes-pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Download today's charts
        if: github.event_name != 'push'   # pushes deploy the committed snapshot right away
        working-directory: globe-tunes
        run: node scripts/fetch-charts.mjs
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: globe-tunes

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4

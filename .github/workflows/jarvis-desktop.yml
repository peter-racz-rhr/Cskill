name: Build Jarvis for Windows

on:
  push:
    paths: ["jarvis-desktop/**", ".github/workflows/jarvis-desktop.yml"]
  workflow_dispatch:

jobs:
  windows:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: jarvis-desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: jarvis-desktop/package-lock.json
      - run: npm ci
      - name: Check the main process loads its dependencies
        run: node -e "import('@anthropic-ai/sdk').then(()=>import('@huggingface/transformers')).then(()=>import('kokoro-js')).then(()=>console.log('deps ok'))"
      - name: Build installer .exe
        run: npx electron-builder --win --x64 --publish never
        env:
          CSC_IDENTITY_AUTO_DISCOVERY: "false"
      - uses: actions/upload-artifact@v4
        with:
          name: Jarvis-Windows
          path: |
            jarvis-desktop/dist/*.exe
          if-no-files-found: error
          retention-days: 30

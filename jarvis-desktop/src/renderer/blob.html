<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; style-src 'self' 'unsafe-inline'">
<title>Jarvis</title>
<style>
  html,body{margin:0;height:100%;background:transparent;overflow:hidden;user-select:none}
  svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
  #glow{filter:drop-shadow(0 4px 10px rgba(0,0,0,.35))}
  body.grab{cursor:grab}
  body.grabbing{cursor:grabbing}
</style>
</head>
<body>
<svg id="svg" aria-label="Jarvis">
  <defs>
    <radialGradient id="light" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="var(--dot)" stop-opacity="1"/>
      <stop offset=".55" stop-color="var(--dot)" stop-opacity=".85"/>
      <stop offset="1" stop-color="var(--dot)" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <g id="glow">
    <circle id="anchor" fill="#000"/>
    <path id="neck" fill="#000"/>
    <circle id="ball" fill="#000"/>
  </g>
  <circle id="edge" fill="none" stroke="#fff" stroke-opacity=".10" stroke-width="1"/>
  <circle id="dot" fill="url(#light)"/>
  <circle id="swirl" fill="none" stroke="#fff" stroke-opacity=".5" stroke-width="1.8" stroke-linecap="round"/>
</svg>
<script src="blob.js"></script>
</body>
</html>

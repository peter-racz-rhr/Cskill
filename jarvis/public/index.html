<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Jarvis</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{
  --bg:#fafafa; --surface:#ffffff; --text:#111113; --muted:#6e6e76; --faint:#a1a1a8;
  --line:#e7e7ea; --accent:#2f6bff; --accent-soft:rgba(47,107,255,.10); --danger:#d92d20;
  --user-bubble:#f0f0f2; --shadow:0 1px 2px rgba(0,0,0,.04),0 4px 16px rgba(0,0,0,.04);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#0e0e10; --surface:#17171a; --text:#ececef; --muted:#9a9aa3; --faint:#62626a;
  --line:#26262b; --accent:#5b8cff; --accent-soft:rgba(91,140,255,.14); --danger:#ff6b5e;
  --user-bubble:#1f1f23; --shadow:none; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#0e0e10; --surface:#17171a; --text:#ececef; --muted:#9a9aa3; --faint:#62626a;
  --line:#26262b; --accent:#5b8cff; --accent-soft:rgba(91,140,255,.14); --danger:#ff6b5e;
  --user-bubble:#1f1f23; --shadow:none; color-scheme:dark;
}
*{box-sizing:border-box;margin:0;padding:0}
html,body{height:100%}
body{background:var(--bg);color:var(--text);font:400 16px/1.55 Inter,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased;display:flex;flex-direction:column}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
svg{width:18px;height:18px;flex:none}

/* header */
header{display:flex;align-items:center;justify-content:space-between;padding:14px 20px;max-width:880px;width:100%;margin:0 auto}
.brand{display:flex;align-items:center;gap:10px;font-weight:600;letter-spacing:-.01em}
.dot{width:8px;height:8px;border-radius:50%;background:var(--faint);transition:background .3s}
body[data-state=listening] .dot{background:var(--danger)}
body[data-state=thinking] .dot,body[data-state=speaking] .dot{background:var(--accent)}
.status{font-size:13px;color:var(--muted);font-weight:400}
.tools{display:flex;gap:2px}
.icon-btn{display:inline-flex;align-items:center;gap:6px;height:34px;padding:0 10px;border-radius:8px;color:var(--muted);font-size:13px}
.icon-btn:hover{background:var(--user-bubble);color:var(--text)}
.icon-btn[aria-pressed=true]{color:var(--accent);background:var(--accent-soft)}

/* thread */
main{flex:1;overflow-y:auto;scroll-behavior:smooth}
.thread{max-width:720px;margin:0 auto;padding:24px 20px 32px;display:flex;flex-direction:column;gap:22px}
.empty{min-height:58vh;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:14px}
.empty h1{font-size:28px;font-weight:600;letter-spacing:-.02em}
.empty p{color:var(--muted)}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;margin-top:10px;max-width:560px}
.chip{border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:8px 14px;font-size:14px;color:var(--text);transition:border-color .2s}
.chip:hover{border-color:var(--accent)}
kbd{font:500 12px Inter,sans-serif;border:1px solid var(--line);border-bottom-width:2px;border-radius:5px;padding:1px 6px;background:var(--surface)}

.orb{width:72px;height:72px;border-radius:50%;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--accent) 55%,white),var(--accent));transition:transform .12s ease-out}
body[data-state=thinking] .orb{animation:breathe 1.4s ease-in-out infinite}
@keyframes breathe{50%{transform:scale(.9);opacity:.7}}

.msg{animation:in .25s ease both}
@keyframes in{from{opacity:0;transform:translateY(4px)}}
.msg.user{align-self:flex-end;max-width:80%;background:var(--user-bubble);padding:10px 16px;border-radius:18px 18px 4px 18px;white-space:pre-wrap}
.msg.bot{align-self:stretch}
.msg.bot .text{white-space:pre-wrap}
.msg.bot .text:empty{display:none}
.steps{display:flex;flex-direction:column;gap:4px}
.steps:not(:empty){margin-bottom:8px}
.step{display:flex;align-items:center;gap:8px;font-size:13px;color:var(--muted)}
.step svg{width:14px;height:14px}
.step.running span::after{content:"…"}
.step.error{color:var(--danger)}
.msg.error .text{color:var(--danger)}
.typing{display:inline-flex;gap:4px;padding:6px 0}
.typing i{width:6px;height:6px;border-radius:50%;background:var(--faint);animation:blink 1.2s infinite}
.typing i:nth-child(2){animation-delay:.15s}.typing i:nth-child(3){animation-delay:.3s}
@keyframes blink{0%,80%,100%{opacity:.25}40%{opacity:1}}

.card{border:1px solid var(--line);background:var(--surface);border-radius:12px;padding:14px 16px;margin:10px 0;box-shadow:var(--shadow)}
.card h4{font-size:14px;font-weight:600;margin-bottom:6px}
.card .body{font-size:15px}
.card ul,.card ol{padding-left:20px}
.card li{margin:2px 0}
.card a{color:var(--accent)}
.card code{font:13px ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--user-bubble);padding:1px 5px;border-radius:4px}
.card pre{font:13px/1.5 ui-monospace,SFMono-Regular,Menlo,monospace;background:var(--user-bubble);padding:10px 12px;border-radius:8px;overflow-x:auto;margin:6px 0;white-space:pre}

/* timers */
.timers{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;max-width:720px;width:100%;margin:0 auto;padding:0 20px}
.timer{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 8px 6px 14px;font-size:14px}
.timer b{font-weight:600;font-variant-numeric:tabular-nums}
.timer.done{border-color:var(--accent);color:var(--accent)}
.timer button{width:22px;height:22px;border-radius:50%;color:var(--faint);display:grid;place-items:center}
.timer button:hover{color:var(--text);background:var(--user-bubble)}
.timer svg{width:12px;height:12px}

/* composer */
footer{padding:12px 20px 20px;max-width:760px;width:100%;margin:0 auto}
.live{min-height:22px;text-align:center;font-size:14px;color:var(--muted);margin-bottom:8px}
.composer{display:flex;align-items:flex-end;gap:8px;background:var(--surface);border:1px solid var(--line);border-radius:24px;padding:6px 6px 6px 18px;box-shadow:var(--shadow);transition:border-color .2s}
.composer:focus-within{border-color:var(--accent)}
textarea{flex:1;min-width:0;resize:none;border:0;outline:none;background:none;color:var(--text);font:inherit;padding:8px 0;max-height:160px;min-height:24px}
textarea::placeholder{color:var(--faint)}
.round{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;flex:none;transition:background .2s,color .2s}
.mic{color:var(--muted);position:relative}
.mic:hover{background:var(--user-bubble);color:var(--text)}
.mic.on{background:var(--danger);color:#fff}
.mic .ring{position:absolute;inset:0;border-radius:50%;border:2px solid var(--danger);opacity:0;pointer-events:none;transition:transform .08s}
.mic.on .ring{opacity:.5}
.send{background:var(--text);color:var(--bg)}
.send:disabled{opacity:.25;cursor:default}
.hint{text-align:center;font-size:12px;color:var(--faint);margin-top:10px}

/* memory drawer */
dialog{margin:0 0 0 auto;height:100%;max-height:100%;width:min(380px,100%);border:0;border-left:1px solid var(--line);background:var(--surface);color:var(--text);padding:0}
dialog::backdrop{background:rgba(0,0,0,.25)}
.drawer{display:flex;flex-direction:column;height:100%}
.drawer header{border-bottom:1px solid var(--line);padding:12px 12px 12px 20px}
.drawer h2{font-size:16px;font-weight:600}
.drawer ul{list-style:none;overflow-y:auto;flex:1;padding:8px 12px}
.drawer li{display:flex;gap:10px;align-items:flex-start;justify-content:space-between;padding:10px 8px;border-bottom:1px solid var(--line);font-size:15px}
.drawer li:last-child{border:0}
.drawer li small{display:block;color:var(--faint);font-size:12px}
.drawer li button{color:var(--faint);padding:4px;border-radius:6px}
.drawer li button:hover{color:var(--danger)}
.drawer .none{color:var(--muted);padding:20px 8px;font-size:14px;border:0}

@media (max-width:600px){
  header{padding:10px 12px 10px 16px}
  .lbl{display:none}
  .thread{padding:16px 16px 24px}
  footer{padding:8px 16px 14px}
  .hint{display:none}
  .empty h1{font-size:24px}
}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
</style>
</head>
<body data-state="idle">

<header>
  <div class="brand"><span class="dot" aria-hidden="true"></span>Jarvis <span class="status" id="status">Ready</span></div>
  <nav class="tools">
    <button class="icon-btn" id="wakeBtn" aria-pressed="false" title="Hands-free: always listen for “Jarvis”">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M3 12h1M7 8v8M11 5v14M15 8v8M19 10v4"/></svg><span class="lbl">Hands-free</span></button>
    <button class="icon-btn" id="voiceBtn" aria-pressed="true" title="Spoken replies">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5 6 9H2v6h4l5 4V5z"/><path id="waves" d="M15.5 8.5a5 5 0 0 1 0 7M19 5a10 10 0 0 1 0 14"/></svg><span class="lbl">Voice</span></button>
    <button class="icon-btn" id="memBtn" title="What Jarvis remembers">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3a6 6 0 0 0-6 6c0 2.2 1.2 3.6 2 4.5.6.7 1 1.5 1 2.5h6c0-1 .4-1.8 1-2.5.8-.9 2-2.3 2-4.5a6 6 0 0 0-6-6zM9.5 19h5M10.5 22h3"/></svg><span class="lbl">Memory</span></button>
    <button class="icon-btn" id="newBtn" title="New conversation">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg><span class="lbl">New</span></button>
  </nav>
</header>

<main id="scroller">
  <div class="thread" id="thread">
    <div class="empty" id="empty">
      <div class="orb" id="orb"></div>
      <h1 id="greet">Hello.</h1>
      <p>Tap the mic or hold <kbd>Space</kbd> to talk, or type below.</p>
      <div class="chips">
        <button class="chip">What's the weather today?</button>
        <button class="chip">Set a 5 minute timer for tea</button>
        <button class="chip">What's in the news?</button>
        <button class="chip">Remember I prefer short answers</button>
      </div>
    </div>
  </div>
</main>

<div class="timers" id="timers"></div>

<footer>
  <div class="live" id="live" aria-live="polite"></div>
  <form class="composer" id="form">
    <textarea id="text" rows="1" placeholder="Ask Jarvis anything…" autocomplete="off"></textarea>
    <button type="button" class="round mic" id="mic" title="Talk (or hold Space)" aria-label="Talk">
      <span class="ring" id="ring"></span>
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="9" y="3" width="6" height="11" rx="3"/><path d="M5 11a7 7 0 0 0 14 0M12 18v3"/></svg>
    </button>
    <button class="round send" id="send" disabled aria-label="Send">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M12 19V5M5 12l7-7 7 7"/></svg>
    </button>
  </form>
  <div class="hint"><kbd>Space</kbd> hold to talk · <kbd>Esc</kbd> stop speaking · <kbd>Enter</kbd> send</div>
</footer>

<dialog id="memDlg">
  <div class="drawer">
    <header><h2>Memory</h2><button class="icon-btn" id="memClose" aria-label="Close"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></header>
    <ul id="memList"></ul>
  </div>
</dialog>

<script>
const $ = (id) => document.getElementById(id);
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
let session = Math.random().toString(36).slice(2);
const ICON = {
  web_search:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><path d="m20 20-3.5-3.5"/></svg>',
  get_weather:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M7 18a4 4 0 0 1 0-8 6 6 0 0 1 11.5 1.5A3.5 3.5 0 0 1 18 18z"/></svg>',
  remember:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M5 12l5 5L20 7"/></svg>',
  forget:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M6 6l12 12M18 6 6 18"/></svg>',
  open_website:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 4h6v6M20 4l-9 9M18 14v6H4V6h6"/></svg>',
  set_timer:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="13" r="8"/><path d="M12 9v4l2 2M9 2h6"/></svg>',
  show_card:'<svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="4" y="5" width="16" height="14" rx="2"/></svg>',
};
const LABEL = { web_search:"Searching the web", get_weather:"Checking the weather", remember:"Saving to memory", forget:"Updating memory", open_website:"Opening website", set_timer:"Setting timer", show_card:"Preparing details" };
const DONE  = { web_search:"Searched the web", get_weather:"Checked the weather", remember:"Saved to memory", forget:"Updated memory", open_website:"Opened website", set_timer:"Timer set", show_card:"Details below" };

/* ---------- helpers ---------- */
function esc(s){ return String(s).replace(/[&<>"']/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c])); }
function md(src){
  let h = esc(src);
  h = h.replace(/```\w*\n?([\s\S]*?)```/g, (_,c)=>`<pre>${c.replace(/\n$/,"")}</pre>`);
  h = h.replace(/`([^`\n]+)`/g, "<code>$1</code>");
  h = h.replace(/\*\*([^*]+)\*\*/g, "<b>$1</b>");
  h = h.replace(/\[([^\]]+)\]\((https?:[^)\s]+)\)/g, '<a href="$2" target="_blank" rel="noopener">$1</a>');
  h = h.replace(/(^|\n)((?:[-*•] .*(?:\n|$))+)/g, (_,p,blk) => p + "<ul>" + blk.trim().split("\n").map(l=>`<li>${l.replace(/^[-*•] /,"")}</li>`).join("") + "</ul>");
  h = h.replace(/(^|\n)((?:\d+\. .*(?:\n|$))+)/g, (_,p,blk) => p + "<ol>" + blk.trim().split("\n").map(l=>`<li>${l.replace(/^\d+\. /,"")}</li>`).join("") + "</ol>");
  return h.split(/(<pre>[\s\S]*?<\/pre>)/).map(part => part.startsWith("<pre>") ? part : part.replace(/\n/g,"<br>")).join("").replace(/<\/(ul|ol)><br>/g,"</$1>");
}
const scrollDown = () => { $("scroller").scrollTop = $("scroller").scrollHeight; };

function setState(s, label){
  document.body.dataset.state = s;
  $("status").textContent = label ?? ({idle:"Ready", listening:"Listening", thinking:"Thinking", speaking:"Speaking"})[s];
}
function idleState(){ setState(wakeMode ? "listening" : "idle", wakeMode ? "Say “Jarvis…”" : "Ready"); }

const hr = new Date().getHours();
$("greet").textContent = `Good ${hr<5?"evening":hr<12?"morning":hr<18?"afternoon":"evening"}.`;

/* ---------- voice out ---------- */
let voiceOn = true, voice = null, speaking = 0;
try { voiceOn = localStorage.getItem("jarvis-voice") !== "off"; } catch {}
function pickVoice(){
  const vs = speechSynthesis.getVoices();
  for (const p of [/Google UK English Male/i, /Daniel/i, /Arthur/i, /Microsoft (Ryan|George|Thomas)/i, /en-GB/i, /^en/i]){
    const v = vs.find(v => p.test(v.name) || p.test(v.lang)); if (v) return v;
  }
  return null;
}
if ("speechSynthesis" in window){ voice = pickVoice(); speechSynthesis.onvoiceschanged = () => voice = pickVoice(); }
function speak(text){
  text = text.replace(/[*_#`>]/g,"").trim();
  if (!voiceOn || !("speechSynthesis" in window) || !text) return;
  const u = new SpeechSynthesisUtterance(text);
  if (voice) u.voice = voice;
  u.rate = 1.05;
  speaking++;
  u.onstart = () => setState("speaking");
  u.onend = u.onerror = () => { speaking = Math.max(0, speaking-1); if (!speaking && !busy){ idleState(); resumeWake(); } };
  speechSynthesis.speak(u);
}
function hush(){ if ("speechSynthesis" in window) speechSynthesis.cancel(); speaking = 0; }
function setVoice(on){
  voiceOn = on; $("voiceBtn").setAttribute("aria-pressed", on); $("waves").style.display = on ? "" : "none";
  if (!on) hush(); try { localStorage.setItem("jarvis-voice", on ? "on" : "off"); } catch {}
}
setVoice(voiceOn);

/* ---------- chat ---------- */
let busy = false;
function addUser(text){
  $("empty")?.remove();
  const m = document.createElement("div"); m.className = "msg user"; m.textContent = text;
  $("thread").appendChild(m); scrollDown();
}
function addBot(){
  const m = document.createElement("div"); m.className = "msg bot";
  m.innerHTML = `<div class="steps"></div><div class="typing"><i></i><i></i><i></i></div><div class="text"></div><div class="cards"></div>`;
  $("thread").appendChild(m); scrollDown(); return m;
}

async function ask(text){
  text = text.trim(); if (!text || busy) return;
  hush(); busy = true; pauseWake();
  addUser(text);
  const m = addBot(), textEl = m.querySelector(".text"), steps = m.querySelector(".steps");
  const stepEls = {};
  setState("thinking");
  let out = "", spoken = 0;
  const flush = (final) => {
    for (;;) {
      const pending = out.slice(spoken);
      const s = final ? pending : pending.match(/^[\s\S]*?[.!?…](?=\s)/)?.[0];
      if (!s || !s.trim()) { if (final) spoken = out.length; return; }
      speak(s); spoken += s.length; if (final) return;
    }
  };
  const stopTyping = () => m.querySelector(".typing")?.remove();
  try {
    const res = await fetch("/api/chat", { method:"POST", headers:{"Content-Type":"application/json"},
      body: JSON.stringify({ session, text, client:{ time:new Date().toString(), tz:Intl.DateTimeFormat().resolvedOptions().timeZone } }) });
    const reader = res.body.getReader(), dec = new TextDecoder(); let buf = "";
    for (;;) {
      const { value, done } = await reader.read(); if (done) break;
      buf += dec.decode(value, { stream:true });
      let i;
      while ((i = buf.indexOf("\n\n")) >= 0) {
        const chunk = buf.slice(0, i); buf = buf.slice(i + 2);
        const ev = /^event: (.*)$/m.exec(chunk)?.[1];
        const data = JSON.parse(/^data: (.*)$/m.exec(chunk)?.[1] ?? "null");
        if (ev === "text") {
          stopTyping(); out += data; textEl.textContent = out; flush(false); scrollDown();
        } else if (ev === "tool") {
          let el = stepEls[data.name];
          if (!el) { el = stepEls[data.name] = document.createElement("div"); steps.appendChild(el); }
          el.className = "step " + data.status;
          el.innerHTML = (ICON[data.name] || "") + `<span>${esc(data.status === "running" ? (LABEL[data.name] || data.name) : data.status === "error" ? "Something went wrong" : (DONE[data.name] || data.name))}</span>`;
          if (data.status === "running") { setState("thinking", LABEL[data.name] || "Working"); if (out && !/\s$/.test(out)) out += " "; }
          scrollDown();
        } else if (ev === "action") doAction(data, m);
        else if (ev === "memory") renderMemory(data);
        else if (ev === "error") { stopTyping(); m.classList.add("error"); out += (out ? "\n" : "") + data.message; textEl.textContent = out; console.warn(data.detail); }
      }
    }
    // server-side tools (web search) never report "done", so settle them when the reply ends
    for (const [name, el] of Object.entries(stepEls)) if (el.classList.contains("running")) {
      el.className = "step done"; el.innerHTML = (ICON[name] || "") + `<span>${esc(DONE[name] || name)}</span>`;
    }
    stopTyping(); flush(true);
  } catch (e) {
    stopTyping(); m.classList.add("error"); textEl.textContent = "Can't reach the Jarvis server. Is it still running?";
  }
  busy = false;
  if (!speaking) { idleState(); resumeWake(); }
}

/* ---------- actions from tools ---------- */
function doAction({ name, input }, m){
  if (name === "open_website") {
    const w = window.open(input.url, "_blank", "noopener");
    if (!w) addCard(m, "Open link", `[${input.url}](${input.url})`); // popup blocked → give a link
  }
  if (name === "show_card") addCard(m, input.title, input.body);
  if (name === "set_timer") addTimer(input.seconds, input.label);
}
function addCard(m, title, body){
  const c = document.createElement("div"); c.className = "card";
  c.innerHTML = `<h4>${esc(title)}</h4><div class="body">${md(body)}</div>`;
  m.querySelector(".cards").appendChild(c); scrollDown();
}

/* ---------- timers ---------- */
const timers = [];
function fmt(r){ const hh = Math.floor(r/3600), mm = Math.floor(r/60)%60, ss = r%60; return (hh ? hh+":"+String(mm).padStart(2,"0") : mm) + ":" + String(ss).padStart(2,"0"); }
function addTimer(sec, label){ timers.push({ id:String(Math.random()), end:Date.now()+sec*1000, label, done:false }); renderTimers(); }
function renderTimers(){
  $("timers").innerHTML = timers.map(t => `<span class="timer ${t.done?"done":""}">${esc(t.label)} <b>${t.done ? "Done" : fmt(Math.max(0, Math.ceil((t.end-Date.now())/1000)))}</b><button data-id="${t.id}" aria-label="Dismiss timer"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round"><path d="M6 6l12 12M18 6 6 18"/></svg></button></span>`).join("");
}
$("timers").onclick = (e) => { const b = e.target.closest("button"); if (!b) return; timers.splice(timers.findIndex(t => t.id === b.dataset.id), 1); renderTimers(); };
setInterval(() => {
  if (!timers.length) return;
  for (const t of timers) if (!t.done && Date.now() >= t.end) {
    t.done = true; speak(`Your ${t.label} timer is done.`);
    try { if (Notification.permission === "granted") new Notification("Jarvis", { body: `${t.label} timer is done` }); } catch {}
  }
  renderTimers();
}, 250);

/* ---------- memory ---------- */
function renderMemory(mem){
  $("memList").innerHTML = mem.notes.length
    ? mem.notes.map((n, i) => `<li><div>${esc(n.note)}<small>${new Date(n.at).toLocaleDateString()}</small></div><button data-i="${i}" aria-label="Forget this" title="Forget"><svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M10 11v6M14 11v6M6 7l1 13h10l1-13M9 7V4h6v3"/></svg></button></li>`).reverse().join("")
    : `<li class="none">Nothing yet. Say “Remember that…” and it will show up here.</li>`;
}
$("memList").onclick = async (e) => {
  const b = e.target.closest("button[data-i]"); if (!b) return;
  const r = await fetch("/api/memory/delete", { method:"POST", body: JSON.stringify({ index: +b.dataset.i }) });
  renderMemory(await r.json());
};
fetch("/api/memory").then(r => r.json()).then(renderMemory).catch(() => renderMemory({ notes: [] }));
$("memBtn").onclick = () => $("memDlg").showModal();
$("memClose").onclick = () => $("memDlg").close();
$("memDlg").onclick = (e) => { if (e.target === $("memDlg")) $("memDlg").close(); };

/* ---------- composer ---------- */
const ta = $("text");
const grow = () => { ta.style.height = "auto"; ta.style.height = ta.scrollHeight + "px"; $("send").disabled = !ta.value.trim(); };
ta.oninput = grow;
ta.onkeydown = (e) => { if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); $("form").requestSubmit(); } };
$("form").onsubmit = (e) => { e.preventDefault(); const t = ta.value; ta.value = ""; grow(); ask(t); };
document.querySelectorAll(".chip").forEach(c => c.onclick = () => ask(c.textContent));
$("newBtn").onclick = async () => {
  hush(); await fetch("/api/reset", { method:"POST", body: JSON.stringify({ session }) }).catch(() => {});
  location.reload();
};

/* ---------- voice in ---------- */
let rec = null, recOn = false, ptt = false, pttText = "", wakeMode = false, autoStop = null;
function makeRec(){
  const r = new SR(); r.lang = navigator.language || "en-US"; r.continuous = true; r.interimResults = true;
  r.onresult = (e) => {
    let interim = "", fin = "";
    for (let i = e.resultIndex; i < e.results.length; i++) { const t = e.results[i][0].transcript; e.results[i].isFinal ? fin += t : interim += t; }
    const heard = (fin || interim).trim();
    if (heard && speaking && (ptt || /jarvis/i.test(heard))) hush(); // barge-in
    if (ptt) {
      if (fin) pttText += fin + " ";
      $("live").textContent = (pttText + interim).trim() || "Listening…";
      if (autoStop) { clearTimeout(autoStop); autoStop = setTimeout(stopRec, 1600); } // tap mode: send after a pause
    } else if (wakeMode && fin && !busy) {
      const m = /\b(?:hey |ok |okay )?jarvis\b[,.!?]?\s*(.*)$/i.exec(fin);
      if (m) { const cmd = m[1].trim(); if (cmd) ask(cmd); else startPTT(true); }
    }
  };
  r.onend = () => { recOn = false; if (ptt) finishPTT(); else if (wakeMode && !busy && !speaking) startRec(); };
  r.onerror = (e) => {
    if (e.error === "not-allowed") { $("live").textContent = "Microphone blocked. Allow it in the address bar."; wakeMode = false; $("wakeBtn").setAttribute("aria-pressed", false); }
    else if (!["no-speech","aborted"].includes(e.error)) $("live").textContent = "Mic error: " + e.error;
  };
  return r;
}
function startRec(){ if (!SR) return; rec ??= makeRec(); if (recOn) return; try { rec.start(); recOn = true; } catch {} }
function stopRec(){ if (rec && recOn) try { rec.stop(); } catch {} }
function startPTT(auto){
  if (!SR) { $("live").textContent = "Voice input needs Chrome or Edge. Typing works everywhere."; ta.focus(); return; }
  if (busy) return;
  hush(); ptt = true; pttText = ""; meter();
  $("mic").classList.add("on"); setState("listening"); $("live").textContent = "Listening…";
  clearTimeout(autoStop); autoStop = auto ? setTimeout(stopRec, 6000) : null;
  if (recOn) { rec.stop(); setTimeout(startRec, 200); } else startRec();
}
function finishPTT(){
  ptt = false; clearTimeout(autoStop); autoStop = null; $("mic").classList.remove("on");
  const t = pttText.trim(); pttText = ""; $("live").textContent = "";
  if (t) ask(t); else { idleState(); resumeWake(); }
}
function pauseWake(){ if (!ptt) stopRec(); }
function resumeWake(){ if (wakeMode && !ptt && !busy && !speaking) setTimeout(startRec, 250); }

$("mic").onclick = () => ptt ? stopRec() : startPTT(true);
let spaceDown = false;
addEventListener("keydown", (e) => {
  if (e.key === "Escape") { hush(); if (ptt) stopRec(); }
  if (e.code === "Space" && !e.repeat && !spaceDown && document.activeElement !== ta && !$("memDlg").open) { e.preventDefault(); spaceDown = true; startPTT(false); }
});
addEventListener("keyup", (e) => { if (e.code === "Space" && spaceDown) { spaceDown = false; if (ptt) stopRec(); } });

$("wakeBtn").onclick = () => {
  if (!SR) { $("live").textContent = "Hands-free needs Chrome or Edge."; return; }
  wakeMode = !wakeMode; $("wakeBtn").setAttribute("aria-pressed", wakeMode);
  if ("Notification" in window && Notification.permission === "default") Notification.requestPermission();
  if (wakeMode) { meter(); idleState(); startRec(); } else { stopRec(); idleState(); }
};
$("voiceBtn").onclick = () => setVoice(!voiceOn);

/* mic level → ring around the mic button, and the orb while listening */
let metering = false;
async function meter(){
  if (metering) return; metering = true;
  try {
    const s = await navigator.mediaDevices.getUserMedia({ audio:true });
    const ctx = new AudioContext(), an = ctx.createAnalyser(); an.fftSize = 256;
    ctx.createMediaStreamSource(s).connect(an);
    const buf = new Uint8Array(an.fftSize);
    (function loop(){
      an.getByteTimeDomainData(buf); let sum = 0; for (const v of buf) { const x = (v-128)/128; sum += x*x; }
      const lvl = Math.min(1, Math.sqrt(sum/buf.length) * 6);
      $("ring").style.transform = `scale(${1 + lvl*0.5})`;
      const orb = $("orb"); if (orb && document.body.dataset.state === "listening") orb.style.transform = `scale(${1 + lvl*0.25})`;
      requestAnimationFrame(loop);
    })();
  } catch { metering = false; }
}
</script>

<title>Globe Tunes Type Picker</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:opsz,wght@14..32,400..700&display=swap">
<style>
/* VOICE everyday tool, dark like the app it dresses
   IDEA a type foundry's specimen wall for one word, with the app header as the proof
   PICTURE the live app header + player at the top, set in the chosen face and accent
   COLOUR #000 ground, #1c1c1e panels, accent chosen by the viewer
   TYPE every Google Font for the specimens; SF/Inter for the interface
   LAYOUT sticky proof band on top, filters, then a dense grid of specimens; phone = one column */
:root{color-scheme:dark;--bg:#000;--panel:#1c1c1e;--panel2:#2c2c2e;--ink:#fff;--ink2:rgba(235,235,245,.62);--ink3:rgba(235,235,245,.32);--fill:rgba(118,118,128,.24);--acc:#0a84ff;--logo:"Inter"}
*{box-sizing:border-box;min-width:0}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font:16px/1.45 -apple-system,BlinkMacSystemFont,"SF Pro Text",Inter,system-ui,sans-serif;overflow-x:clip;-webkit-font-smoothing:antialiased}
button,input{font:inherit;color:inherit}
.wrap{padding-left:max(4vw,16px,env(safe-area-inset-left,0px));padding-right:max(4vw,16px,env(safe-area-inset-right,0px));max-width:1400px;margin:0 auto}
header.top{padding-block:28px 14px}
h1{font-size:clamp(28px,4vw,40px);line-height:1.05;letter-spacing:-.03em;margin:0}
.lead{color:var(--ink2);margin:8px 0 0;max-width:62ch}
/* proof band */
.proof{position:sticky;top:0;z-index:5;background:linear-gradient(#000 85%,rgba(0,0,0,0));padding-block:12px 18px}
body::before{content:"";position:fixed;top:0;left:0;right:0;height:env(safe-area-inset-top,0px);background:#000;z-index:6}
.proof .wrap{display:grid;grid-template-columns:minmax(0,1.1fr) minmax(0,1fr);gap:14px;align-items:stretch}
.mock{background:var(--panel);border-radius:22px;padding:16px 18px;display:flex;flex-direction:column;justify-content:center;gap:10px}
.logo{font-family:var(--logo),Inter,sans-serif;font-weight:var(--lw,700);font-size:clamp(30px,4.2vw,46px);line-height:1.1;letter-spacing:var(--ls,0);color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.logo.acc{color:var(--acc)}
.meta{display:flex;flex-wrap:wrap;align-items:center;gap:8px;color:var(--ink2);font-size:14px}
.meta b{color:var(--ink);font-weight:600}
.wts{display:flex;flex-wrap:wrap;gap:6px}
.wts button,.tog{border:0;border-radius:999px;background:var(--fill);padding:5px 11px;font-size:13px;font-weight:600;cursor:pointer}
.wts button[aria-pressed=true],.tog[aria-pressed=true]{background:#fff;color:#000}
.player{background:var(--panel);border-radius:22px;padding:12px;display:grid;grid-template-columns:64px minmax(0,1fr) auto;grid-template-rows:auto auto;gap:6px 14px;align-items:center}
.art{grid-row:1/3;width:64px;height:64px;border-radius:14px;background:conic-gradient(from 200deg,#1b3a5c,#0e7c86,#f2c14e,#e76f51,#1b3a5c)}
.pt{font-weight:600;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ps{font-size:13px;color:var(--ink2)}
.pbtn{width:46px;height:46px;border-radius:50%;border:0;background:var(--acc);display:grid;place-items:center;grid-row:1/3;grid-column:3}
.bar{grid-column:2;height:4px;border-radius:2px;background:var(--fill);position:relative;overflow:hidden}
.bar::after{content:"";position:absolute;inset:0 62% 0 0;background:var(--acc)}
.cta{grid-column:1/-1;display:flex;gap:8px;margin-top:6px}
.cta span{flex:1;height:40px;border-radius:12px;display:grid;place-items:center;font-size:15px;font-weight:600}
.cta .p{background:var(--acc);color:var(--on,#fff)}
.cta .s{background:var(--fill);color:#fff}
/* colours */
.cols{grid-column:1/-1;display:flex;flex-wrap:wrap;align-items:center;gap:8px}
.cols .lab{color:var(--ink2);font-size:14px;margin-right:4px}
.sw{width:34px;height:34px;border-radius:50%;border:0;cursor:pointer;background:var(--c);position:relative;transition:scale .15s}
.sw:hover{scale:1.1}
.sw[aria-pressed=true]::after{content:"";position:absolute;inset:-5px;border-radius:50%;border:2px solid var(--c)}
.sw.old{opacity:.5}
.custom{display:flex;align-items:center;gap:6px;color:var(--ink2);font-size:13px}
.custom input{width:34px;height:34px;border:0;padding:0;background:none;cursor:pointer}
.saved{margin-left:auto;font-size:13px;color:var(--ink2)}
.saved.ok{color:#30d158}
/* filters */
.filters{display:flex;flex-wrap:wrap;gap:8px;align-items:center;padding-block:6px 14px}
.tabs{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;flex:1 1 520px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;border:0;border-radius:999px;background:var(--panel);padding:8px 14px;font-size:14px;font-weight:600;cursor:pointer;color:var(--ink2)}
.tab i{font-style:normal;color:var(--ink3);margin-left:5px;font-weight:500}
.tab[aria-pressed=true]{background:#fff;color:#000}
.tab[aria-pressed=true] i{color:rgba(0,0,0,.5)}
.field{display:flex;align-items:center;gap:8px;background:var(--panel);border-radius:12px;padding:0 12px;height:42px;flex:1 1 220px}
.field input{flex:1;border:0;background:none;outline:none;font-size:16px}
.field span{color:var(--ink3);font-size:13px;white-space:nowrap}
.count{color:var(--ink2);font-size:14px;white-space:nowrap}
/* grid */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(270px,1fr));gap:10px;padding-bottom:60px}
.card{position:relative;background:var(--panel);border-radius:18px;padding:18px 16px 12px;cursor:pointer;border:0;text-align:left;display:flex;flex-direction:column;gap:12px;min-height:132px;transition:background .15s,scale .15s}
.card:hover{background:var(--panel2)}
.card:active{scale:.98}
.card[aria-pressed=true]{background:#fff;color:#000}
.card[aria-pressed=true] .fn,.card[aria-pressed=true] .fc{color:rgba(0,0,0,.6)}
.spec{font-size:clamp(30px,3.2vw,40px);line-height:1.15;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;opacity:0;transition:opacity .3s}
.spec.in{opacity:1}
.foot{display:flex;align-items:baseline;gap:8px;margin-top:auto}
.fn{font-size:14px;font-weight:600;color:var(--ink)}
.fc{font-size:12px;color:var(--ink3)}
.star{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:none;color:var(--ink3);cursor:pointer;display:grid;place-items:center}
.star[aria-pressed=true]{color:#ffd60a}
.card[aria-pressed=true] .star{color:rgba(0,0,0,.35)}
.card[aria-pressed=true] .star[aria-pressed=true]{color:#e0a800}
.more{display:block;margin:0 auto 40px;border:0;border-radius:12px;background:var(--panel);padding:12px 22px;font-weight:600;cursor:pointer}
.empty{color:var(--ink2);padding:40px 0;text-align:center}
@media (max-width:760px){
  .proof{position:static}
  .proof .wrap{grid-template-columns:minmax(0,1fr)}
  .grid{grid-template-columns:minmax(0,1fr)}
}
@media (prefers-reduced-motion:reduce){.spec{transition:none}.card,.sw{transition:none}}
</style>

<header class="top wrap">
  <h1>Pick the Globe Tunes logo font and colour</h1>
  <p class="lead">Tap a font to try it on the app. Star the ones you like, then pick an accent colour. Your choice saves itself, and Claude reads it from here.</p>
</header>

<section class="proof" aria-label="Live preview">
  <div class="wrap">
    <div class="mock">
      <div class="logo" id="logo">Globe Tunes</div>
      <div class="meta"><b id="curName">Inter</b><span id="curCat">sans-serif</span><div class="wts" id="wts" role="group" aria-label="Weight"></div></div>
      <div class="meta"><button class="tog" id="accLogo" aria-pressed="false">Logo in accent colour</button></div>
    </div>
    <div class="player">
      <div class="art" aria-hidden="true"></div>
      <div class="pt">Number one right now</div>
      <button class="pbtn" aria-label="Play (preview)"><svg width="20" height="20" viewBox="0 0 24 24"><path d="M7 4.6v14.8c0 .9 1 1.5 1.8 1l11.6-7.4c.7-.5.7-1.5 0-2L8.8 3.6C8 3.1 7 3.7 7 4.6z" fill="var(--on,#fff)"/></svg></button>
      <div class="bar"></div>
      <div class="cta"><span class="p">Play</span><span class="s">Shuffle</span></div>
    </div>
    <div class="cols" role="group" aria-label="Accent colour">
      <span class="lab">Accent</span>
      <span id="swatches" style="display:contents"></span>
      <label class="custom"><input type="color" id="customCol" value="#0a84ff" aria-label="Custom colour">Custom</label>
      <span class="saved" id="saved" role="status">Not saved yet</span>
    </div>
  </div>
</section>

<main class="wrap">
  <div class="filters">
    <div class="tabs" id="tabs" role="group" aria-label="Category"></div>
    <label class="field"><svg width="16" height="16" viewBox="0 0 16 16" aria-hidden="true"><circle cx="6.8" cy="6.8" r="5.3" fill="none" stroke="currentColor" stroke-width="1.8"/><path d="M10.8 10.8 15 15" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg><input id="q" type="search" placeholder="Search 1,882 fonts" aria-label="Search fonts"></label>
    <label class="field"><span>Text</span><input id="sample" value="Globe Tunes" maxlength="30" aria-label="Sample text"></label>
    <span class="count" id="count"></span>
  </div>
  <div class="grid" id="grid"></div>
  <button class="more" id="more" hidden>Show more</button>
</main>

<script>
{
const $ = id => document.getElementById(id);
const COLORS = [
  ['Blue', '#0a84ff'], ['Sky', '#5ac8fa'], ['Cyan', '#64d2ff'], ['Mint', '#63e6e2'], ['Teal', '#40c8e0'],
  ['Green', '#30d158'], ['Lime', '#a8e63b'], ['Yellow', '#ffd60a'], ['Orange', '#ff9f0a'], ['Red', '#ff453a'],
  ['Indigo', '#5e5ce6'], ['Purple', '#bf5af2'], ['White', '#f5f5f7'], ['Current pink', '#ff375f']
];
const TABS = [['dots', 'Dot matrix'], ['pixel', 'Pixel'], ['fav', 'Starred'], ['display', 'Display'], ['sans-serif', 'Sans'], ['serif', 'Serif'], ['handwriting', 'Handwriting'], ['monospace', 'Mono'], ['all', 'All']];
const PAGE = 120;
let FONTS = [], tab = 'dots', shown = PAGE;
const state = { font: 'Inter', weight: 700, color: '#0a84ff', colorName: 'Blue', accentLogo: false, favorites: [] };
let db = null, docRef = null, saveTimer = 0;

/* ---------- helpers ---------- */
const lum = hex => { const n = parseInt(hex.slice(1), 16), c = [n >> 16, (n >> 8) & 255, n & 255].map(v => { v /= 255; return v <= .03928 ? v / 12.92 : ((v + .055) / 1.055) ** 2.4; }); return .2126 * c[0] + .7152 * c[1] + .0722 * c[2]; };
const textOn = hex => lum(hex) > .4 ? '#000' : '#fff';
const bestWeight = w => w.includes(700) ? 700 : w.filter(x => x <= 800).at(-1) || w.at(-1) || 400;
const sampleText = () => ($('sample').value.trim() || 'Globe Tunes');

/* ---------- lazy font loading: one small CSS request per batch, subset to the sample text ---------- */
const loaded = new Set(); let queue = [], qTimer = 0;
function want(f, weights){
  const key = f.f + '|' + weights.join(',') + '|' + sampleText();
  if (loaded.has(key)) return; loaded.add(key);
  queue.push([f, weights]); clearTimeout(qTimer); qTimer = setTimeout(flush, 30);
}
function flush(){
  const batch = queue.splice(0, 18); if (!batch.length) return;
  const fams = batch.map(([f, ws]) => {
    const ital = '', name = encodeURIComponent(f.f).replace(/%20/g, '+');
    const wl = [...new Set(ws)].sort((a, b) => a - b);
    return 'family=' + name + (wl.length && !(wl.length === 1 && wl[0] === 400) ? ':wght@' + wl.join(';') : '') + ital;
  }).join('&');
  const l = document.createElement('link'); l.rel = 'stylesheet';
  l.href = 'https://fonts.googleapis.com/css2?' + fams + '&display=block&text=' + encodeURIComponent(sampleText() + 'Globe Tunes');
  document.head.append(l);
  if (queue.length) flush();
}

/* ---------- grid ---------- */
const io = new IntersectionObserver(es => {
  for (const e of es) if (e.isIntersecting){
    const el = e.target, f = FONTS[+el.dataset.i]; io.unobserve(el);
    want(f, [bestWeight(f.w)]);
    const spec = el.querySelector('.spec');
    document.fonts.load(`${bestWeight(f.w)} 32px "${f.f}"`, sampleText()).finally(() => spec.classList.add('in'));
    setTimeout(() => spec.classList.add('in'), 2500);
  }
}, { rootMargin: '400px' });

function filtered(){
  const q = $('q').value.trim().toLowerCase();
  return FONTS.map((f, i) => [f, i]).filter(([f]) => {
    if (q && !f.f.toLowerCase().includes(q)) return false;
    if (tab === 'all') return true;
    if (tab === 'fav') return state.favorites.includes(f.f);
    if (tab === 'dots' || tab === 'pixel') return f.t.includes(tab);
    return f.c === tab;
  });
}
function render(){
  io.disconnect();
  const list = filtered(), grid = $('grid'), text = sampleText();
  $('count').textContent = `${list.length.toLocaleString()} font${list.length === 1 ? '' : 's'}`;
  grid.replaceChildren();
  if (!list.length){
    const p = document.createElement('p'); p.className = 'empty';
    p.textContent = tab === 'fav' ? 'No starred fonts yet. Tap the star on any font you like.' : 'No fonts match that search.';
    grid.append(p);
  }
  for (const [f, i] of list.slice(0, shown)){
    const card = document.createElement('div');
    card.className = 'card'; card.dataset.i = i; card.tabIndex = 0; card.setAttribute('role', 'button');
    card.setAttribute('aria-pressed', String(state.font === f.f));
    const spec = document.createElement('div'); spec.className = 'spec';
    spec.style.fontFamily = `"${f.f}", Inter, sans-serif`; spec.style.fontWeight = bestWeight(f.w); spec.textContent = text;
    const foot = document.createElement('div'); foot.className = 'foot';
    const fn = document.createElement('span'); fn.className = 'fn'; fn.textContent = f.f;
    const fc = document.createElement('span'); fc.className = 'fc'; fc.textContent = (f.t[0] === 'dots' ? 'dot matrix' : f.t[0] || f.c);
    foot.append(fn, fc);
    const star = document.createElement('button'); star.className = 'star'; star.type = 'button';
    star.setAttribute('aria-label', 'Star ' + f.f); star.setAttribute('aria-pressed', String(state.favorites.includes(f.f)));
    star.innerHTML = '<svg width="18" height="18" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3.2l2.6 5.4 5.9.8-4.3 4.1 1 5.9L12 16.6l-5.2 2.8 1-5.9-4.3-4.1 5.9-.8z" fill="currentColor"/></svg>';
    card.append(spec, foot, star);
    grid.append(card); io.observe(card);
  }
  $('more').hidden = list.length <= shown;
}
$('grid').addEventListener('click', e => {
  const card = e.target.closest('.card'); if (!card) return;
  const f = FONTS[+card.dataset.i];
  if (e.target.closest('.star')){
    const i = state.favorites.indexOf(f.f);
    i >= 0 ? state.favorites.splice(i, 1) : state.favorites.push(f.f);
    e.target.closest('.star').setAttribute('aria-pressed', String(i < 0));
    if (tab === 'fav') render();
    save(); return;
  }
  pickFont(f);
});
$('grid').addEventListener('keydown', e => { if ((e.key === 'Enter' || e.key === ' ') && e.target.classList.contains('card')){ e.preventDefault(); pickFont(FONTS[+e.target.dataset.i]); } });
$('more').onclick = () => { shown += PAGE; render(); };

/* ---------- preview ---------- */
function pickFont(f, quiet){
  state.font = f.f; state.weight = bestWeight(f.w);
  want(f, f.w);
  document.querySelectorAll('.card[aria-pressed=true]').forEach(c => c.setAttribute('aria-pressed', 'false'));
  document.querySelector(`.card[data-i="${FONTS.indexOf(f)}"]`)?.setAttribute('aria-pressed', 'true');
  paint(); if (!quiet) save();
}
function paint(){
  const f = FONTS.find(x => x.f === state.font) || { f: state.font, c: '', w: [400, 700], t: [] };
  const r = document.documentElement.style;
  r.setProperty('--logo', `"${f.f}"`); r.setProperty('--lw', state.weight);
  r.setProperty('--acc', state.color); r.setProperty('--on', textOn(state.color));
  $('logo').textContent = sampleText();
  $('logo').classList.toggle('acc', state.accentLogo);
  $('accLogo').setAttribute('aria-pressed', String(state.accentLogo));
  $('curName').textContent = f.f; $('curCat').textContent = f.t.includes('dots') ? 'dot matrix' : f.t.includes('pixel') ? 'pixel' : f.c;
  $('wts').replaceChildren(...f.w.map(w => {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = w;
    b.setAttribute('aria-pressed', String(w === state.weight));
    b.onclick = () => { state.weight = w; paint(); save(); };
    return b;
  }));
  document.querySelectorAll('.sw').forEach(s => s.setAttribute('aria-pressed', String(s.dataset.c === state.color)));
}
$('accLogo').onclick = () => { state.accentLogo = !state.accentLogo; paint(); save(); };
$('swatches').replaceChildren(...COLORS.map(([n, c]) => {
  const b = document.createElement('button'); b.className = 'sw' + (n === 'Current pink' ? ' old' : ''); b.type = 'button';
  b.dataset.c = c; b.style.setProperty('--c', c); b.title = n; b.setAttribute('aria-label', n);
  b.onclick = () => { state.color = c; state.colorName = n; paint(); save(); };
  return b;
}));
$('customCol').addEventListener('input', e => { state.color = e.target.value; state.colorName = 'Custom ' + e.target.value; paint(); save(); });

/* ---------- tabs / search ---------- */
function renderTabs(){
  const n = k => k === 'all' ? FONTS.length : k === 'fav' ? state.favorites.length : FONTS.filter(f => k === 'dots' || k === 'pixel' ? f.t.includes(k) : f.c === k).length;
  $('tabs').replaceChildren(...TABS.map(([k, label]) => {
    const b = document.createElement('button'); b.className = 'tab'; b.type = 'button';
    b.setAttribute('aria-pressed', String(k === tab)); b.textContent = label;
    const i = document.createElement('i'); i.textContent = n(k).toLocaleString(); b.append(i);
    b.onclick = () => { tab = k; shown = PAGE; renderTabs(); render(); scrollTo({ top: $('tabs').offsetTop - 220, behavior: 'smooth' }); };
    return b;
  }));
}
let qT = 0;
$('q').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { if ($('q').value.trim() && tab !== 'all'){ tab = 'all'; renderTabs(); } shown = PAGE; render(); }, 150); });
$('sample').addEventListener('input', () => { clearTimeout(qT); qT = setTimeout(() => { render(); paint(); const f = FONTS.find(x => x.f === state.font); if (f) want(f, f.w); }, 300); });

/* ---------- saving (db) ---------- */
function save(){
  renderTabs();
  if (!docRef){ $('saved').textContent = 'Saving is off in this view'; return; }
  $('saved').textContent = 'Saving…'; $('saved').classList.remove('ok');
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    docRef.set({ font: state.font, weight: state.weight, color: state.color, colorName: state.colorName, accentLogo: state.accentLogo, favorites: state.favorites.slice(0, 200), at: new Date().toISOString() })
      .then(() => { $('saved').textContent = 'Saved'; $('saved').classList.add('ok'); })
      .catch(() => { $('saved').textContent = 'Couldn’t save. Tell Claude your pick in chat'; });
  }, 500);
}

/* ---------- boot ---------- */
fetch('fonts.json').then(r => r.json()).then(list => {
  FONTS = list; renderTabs(); render(); paint();
  const f = FONTS.find(x => x.f === state.font); if (f) want(f, f.w);
}).catch(() => { $('grid').innerHTML = '<p class="empty">The font list didn’t load. Reload the page.</p>'; });

(async () => {
  try { db = await window.claude?.use?.('db'); } catch { db = null; }
  if (!db){ $('saved').textContent = 'Saving is off in this view'; return; }
  docRef = db.doc('picks/current');
  const done = setTimeout(() => {}, 10000);
  try {
    const snap = await docRef.get(); clearTimeout(done);
    if (snap.exists){
      const d = snap.data() || {};
      if (typeof d.font === 'string') state.font = d.font;
      if (typeof d.weight === 'number') state.weight = d.weight;
      if (typeof d.color === 'string' && /^#[0-9a-f]{6}$/i.test(d.color)) state.color = d.color;
      if (typeof d.colorName === 'string') state.colorName = d.colorName;
      state.accentLogo = !!d.accentLogo;
      if (Array.isArray(d.favorites)) state.favorites = d.favorites.filter(x => typeof x === 'string');
      $('saved').textContent = 'Saved'; $('saved').classList.add('ok');
      const f = FONTS.find(x => x.f === state.font); if (f) want(f, f.w);
      renderTabs(); render(); paint();
    } else $('saved').textContent = 'Pick a font to save';
  } catch { $('saved').textContent = 'Saving is off in this view'; docRef = null; }
})();
}
</script>
